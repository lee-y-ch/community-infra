apiVersion: v1
kind: ConfigMap
metadata:
  name: community-backend-config
  namespace: community
data:
  FILE_UPLOAD_DIR: "/home/ubuntu/apps/uploads/images"
  AWS_REGION: "ap-northeast-2"
  S3_ORIGINAL_BUCKET: "leo-community-images-original-501479502338-ap-northeast-2-an"
  S3_PROCESSED_BUCKET: "leo-community-images-processed-501479502338-ap-northeast-2-an"
  IMAGE_BASE_URL: "https://images.leo-community.xyz"
  PRESIGNED_URL_EXPIRATION_SECONDS: "300"
  IMAGE_MAX_FILE_SIZE: "10MB"
  SERVER_SHUTDOWN: "graceful"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "25s"