apiVersion: v1
kind: Service
metadata:
  name: community-backend-svc
  namespace: community
  labels:
    app: community
    tier: backend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.healthcheck.path }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: community
    tier: backend
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
