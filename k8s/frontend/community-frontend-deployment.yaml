apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-frontend-deployment
  namespace: community
spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: community
      tier: frontend

  template:
    metadata:
      labels:
        app: community
        tier: frontend
        component: web

    spec:
      containers:
        - name: frontend
          image: 501479502338.dkr.ecr.ap-northeast-2.amazonaws.com/community/frontend:git-5843b16
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: "120m"
              memory: "96Mi"
            limits:
              memory: "192Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      