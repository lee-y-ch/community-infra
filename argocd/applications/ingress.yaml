apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lee-y-ch/community-infra.git
    targetRevision: main
    path: helm/ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: community
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
